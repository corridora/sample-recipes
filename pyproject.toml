[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "corridora-sample-recipes"
version = "1.0.0"
description = "Observable Vue / FastAPI recipe sample for Corridora"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn>=0.41,<1", "httpx>=0.28,<1",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "google-cloud-firestore>=2.21,<3", "google-cloud-storage>=3.4,<4",
  "google-cloud-pubsub>=2.33,<3", "google-cloud-monitoring>=2.27,<3",
  "google-auth>=2.40,<3", "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
